<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board Game Collection</title>
  <meta name="description" content="Search and filter our board game collection by players, play time and owner.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>Board Game Collection</h1>
    <p class="meta" id="meta">Loading the collection…</p>
  </header>

  <main>
    <form class="filters" id="filters" role="search">
      <label class="search">
        <span>Search</span>
        <input type="search" name="q" placeholder="Game or category" autocomplete="off">
      </label>
      <label>
        <span>Players</span>
        <select name="players"><option value="">Any</option></select>
      </label>
      <label>
        <span>Play time</span>
        <select name="time">
          <option value="">Any</option>
          <option value="30">Up to 30 min</option>
          <option value="45">Up to 45 min</option>
          <option value="60">Up to 1 hour</option>
          <option value="90">Up to 1½ hours</option>
          <option value="120">Up to 2 hours</option>
          <option value="180">Up to 3 hours</option>
        </select>
      </label>
      <label id="owner-filter" hidden>
        <span>Owner</span>
        <select name="owner"><option value="">Anyone</option></select>
      </label>
      <label id="expansions-filter" hidden>
        <span>Expansions</span>
        <select name="expansions">
          <option value="">Hidden</option>
          <option value="show">Shown</option>
        </select>
      </label>
      <button type="reset">Clear</button>
    </form>

    <p class="count" id="count" aria-live="polite"></p>

    <table class="games" id="games" hidden>
      <thead>
        <tr>
          <th scope="col" data-sort="name"><button type="button">Game</button></th>
          <th scope="col" data-sort="year"><button type="button">Year</button></th>
          <th scope="col" data-sort="rank"><button type="button">Rank</button></th>
          <th scope="col" data-sort="players"><button type="button">Players</button></th>
          <th scope="col" data-sort="playtime"><button type="button">Time</button></th>
          <th scope="col" data-sort="age"><button type="button">Age</button></th>
          <th scope="col" id="owner-column" hidden>Owner</th>
          <th scope="col"><span class="visually-hidden">Details</span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p class="message" id="message" hidden></p>

    <!-- One popup, filled with a game's description or categories when its button is used -->
    <div class="popover" id="popover" role="dialog" aria-labelledby="popover-game" hidden>
      <div class="popover-header">
        <div>
          <span class="popover-kind" id="popover-kind"></span>
          <strong id="popover-game"></strong>
        </div>
        <button type="button" class="popover-close" aria-label="Close">×</button>
      </div>
      <p class="popover-text" id="popover-text"></p>
    </div>
  </main>

  <footer class="page-footer">
    <p>Game data from <a href="https://boardgamegeek.com">BoardGameGeek</a>, refreshed daily.</p>
    <a class="powered-by" href="https://boardgamegeek.com">
      <img src="assets/powered_by_K_01_SM.png" alt="Powered by BGG" width="136" height="40">
    </a>
  </footer>
</body>
</html>
